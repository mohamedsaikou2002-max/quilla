name: QUILLA Android debug APK
on:
  push:
    branches: [quilla-android-local-llm]
    paths:
      - 'android/app/**'
      - 'android/assets/**'
      - 'android/build.gradle'
      - 'android/gradle.properties'
      - 'android/settings.gradle'
      - '.github/workflows/quilla-android.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the neuron icon assets
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/assets
          base64 --decode android/assets/quilla_icon.png.b64 > android/app/src/main/res/drawable-nodpi/quilla_icon.png
          base64 --decode android/assets/neuron.png.b64 > android/app/src/main/assets/neuron.png
          file android/app/src/main/res/drawable-nodpi/quilla_icon.png
          file android/app/src/main/assets/neuron.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile QUILLA APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug-signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: QUILLA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
